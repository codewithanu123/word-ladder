<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Ladder</title>
<style>
  :root{
    --bg:#15181c;
    --card:#1f2328;
    --text:#e6e8eb;
    --muted:#9aa2ab;
    --border:#33383f;
    --tile-bg:#262b31;
    --tile-border:#3a4048;
    --tile-goal-bg:#1f2328;
    --tile-goal-border:#3b9eff;
    --accent:#3b9eff;
    --accent-text:#0b1015;
    --danger:#ff6b6b;
    --success:#4fd17a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;
    justify-content:center;
    padding:24px 16px 60px;
  }
  .wrap{
    width:100%;
    max-width:480px;
  }
  h1{
    font-size:1.5rem;
    margin:0 0 4px;
    text-align:center;
  }
  .sub{
    color:var(--muted);
    text-align:center;
    font-size:0.9rem;
    margin:0 0 20px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px;
    margin-bottom:16px;
  }
  .goal-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    flex-wrap:wrap;
  }
  .goal-label{
    font-size:0.7rem;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--muted);
    text-align:center;
    margin-bottom:6px;
  }
  .arrow{
    font-size:1.4rem;
    color:var(--muted);
  }
  .tiles{
    display:flex;
    gap:6px;
  }
  .tile{
    width:44px;
    height:44px;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    font-size:1.2rem;
    background:var(--tile-bg);
    border:1px solid var(--tile-border);
  }
  .tile.goal{
    background:var(--tile-goal-bg);
    border:2px solid var(--tile-goal-border);
    color:var(--accent);
  }
  .tile.correct{
    background:var(--success);
    color:#0b1015;
    border-color:var(--success);
  }
  .chain{
    display:flex;
    flex-direction:column;
    gap:6px;
    max-height:260px;
    overflow-y:auto;
    padding-right:2px;
  }
  .chain-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .chain-index{
    width:20px;
    color:var(--muted);
    font-size:0.8rem;
    text-align:right;
    flex-shrink:0;
  }
  .input-row{
    display:flex;
    gap:8px;
    justify-content:center;
    margin-top:4px;
  }
  .letter-input{
    width:44px;
    height:44px;
    text-align:center;
    font-size:1.2rem;
    font-weight:700;
    text-transform:uppercase;
    border-radius:8px;
    border:1px solid var(--tile-border);
    background:var(--tile-bg);
    color:var(--text);
  }
  .letter-input:focus{
    outline:2px solid var(--accent);
  }
  .btn-row{
    display:flex;
    gap:8px;
    margin-top:14px;
    justify-content:center;
    flex-wrap:wrap;
  }
  button{
    font-family:inherit;
    font-size:0.9rem;
    font-weight:600;
    padding:10px 16px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    cursor:pointer;
  }
  button.primary{
    background:var(--accent);
    color:var(--accent-text);
    border-color:var(--accent);
  }
  button:active{ transform:scale(0.98); }
  .msg{
    min-height:20px;
    text-align:center;
    font-size:0.85rem;
    margin-top:10px;
  }
  .msg.error{ color:var(--danger); }
  .msg.ok{ color:var(--success); }
  .stats{
    display:flex;
    justify-content:center;
    gap:24px;
    text-align:center;
    color:var(--muted);
    font-size:0.85rem;
  }
  .stats b{
    display:block;
    color:var(--text);
    font-size:1.1rem;
  }
  .win-panel{
    text-align:center;
  }
  .win-panel h2{
    margin:0 0 6px;
    font-size:1.3rem;
  }
  .win-panel p{
    color:var(--muted);
    margin:0 0 14px;
    font-size:0.9rem;
  }
  textarea.share{
    width:100%;
    min-height:70px;
    resize:none;
    overflow:hidden;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--tile-bg);
    color:var(--text);
    font-family:inherit;
    font-size:0.85rem;
    line-height:1.5;
    padding:10px;
    margin-bottom:10px;
  }
  .hidden{ display:none; }
  footer{
    text-align:center;
    color:var(--muted);
    font-size:0.75rem;
    margin-top:8px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🪜 Word Ladder</h1>
  <p class="sub">Turn the start word into the target word — one letter at a time. Every step must be a real word.</p>
  <p class="sub" id="modeLabel" style="margin-top:-14px;"></p>

  <div class="card">
    <div class="goal-row">
      <div>
        <div class="goal-label">Start</div>
        <div class="tiles" id="startTiles"></div>
      </div>
      <div class="arrow">→</div>
      <div>
        <div class="goal-label">Target</div>
        <div class="tiles" id="targetTiles"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="chain" id="chain"></div>
    <div class="input-row" id="inputRow">
      <input class="letter-input" maxlength="1" autocapitalize="characters" autocomplete="off" spellcheck="false">
      <input class="letter-input" maxlength="1" autocapitalize="characters" autocomplete="off" spellcheck="false">
      <input class="letter-input" maxlength="1" autocapitalize="characters" autocomplete="off" spellcheck="false">
      <input class="letter-input" maxlength="1" autocapitalize="characters" autocomplete="off" spellcheck="false">
    </div>
    <div class="msg" id="msg"></div>
    <div class="stats">
      <div>Moves<b id="moveCount">0</b></div>
    </div>
    <div class="btn-row">
      <button id="submitBtn" class="primary">Enter</button>
      <button id="newPuzzleBtn">New Puzzle</button>
    </div>
  </div>

  <div class="card win-panel hidden" id="winPanel">
    <h2 id="winTitle">Solved!</h2>
    <p id="winSub"></p>
    <textarea class="share" id="shareText" readonly></textarea>
    <a id="shareLink" href="#" target="_blank" rel="noopener" style="display:block;font-size:0.8rem;color:var(--accent);text-decoration:none;margin:-4px 0 12px;">Play again</a>
    <div class="btn-row">
      <button class="primary" id="copyBtn">Copy result to share</button>
      <button id="playAgainBtn">PLAY</button>
    </div>
  </div>

  <footer>Word list: common 4-letter English words. New daily challenge every day.</footer>
</div>

const WORDS = [...new Set(WORD_LIST.filter(w => w.length === 4))];
const WORD_SET = new Set([...WORDS, ...DICTIONARY.filter(w => w.length === 4)]);

function diffCount(a, b) {
  let c = 0;
  for (let i = 0; i < 4; i++) if (a[i] !== b[i]) c++;
  return c;
}

function buildAdjacency(words) {
  const adj = new Map();
  words.forEach(w => adj.set(w, []));
  for (let i = 0; i < words.length; i++) {
    for (let j = i + 1; j < words.length; j++) {
      if (diffCount(words[i], words[j]) === 1) {
        adj.get(words[i]).push(words[j]);
        adj.get(words[j]).push(words[i]);
      }
    }
  }
  return adj;
}

function largestComponent(words, adj) {
  const visited = new Set();
  let best = [];
  for (const w of words) {
    if (visited.has(w)) continue;
    const comp = [];
    const queue = [w];
    visited.add(w);
    while (queue.length) {
      const cur = queue.shift();
      comp.push(cur);
      for (const n of adj.get(cur)) {
        if (!visited.has(n)) { visited.add(n); queue.push(n); }
      }
    }
    if (comp.length > best.length) best = comp;
  }
  return best;
}

function bfsDistance(adj, start, target) {
  if (start === target) return 0;
  const visited = new Set([start]);
  const queue = [[start, 0]];
  while (queue.length) {
    const [cur, d] = queue.shift();
    for (const n of adj.get(cur)) {
      if (n === target) return d + 1;
      if (!visited.has(n)) { visited.add(n); queue.push([n, d + 1]); }
    }
  }
  return -1;
}

const ADJ = buildAdjacency(WORDS);
const COMPONENT = largestComponent(WORDS, ADJ);

function pickPuzzle(rng) {
  rng = rng || Math.random;
  let best = null;
  for (let attempt = 0; attempt < 300; attempt++) {
    const a = COMPONENT[Math.floor(rng() * COMPONENT.length)];
    const b = COMPONENT[Math.floor(rng() * COMPONENT.length)];
    if (a === b) continue;
    const d = bfsDistance(ADJ, a, b);
    if (d >= 3 && d <= 6) return { start: a, target: b, par: d };
    if (d > 0 && (!best || Math.abs(d - 4) < Math.abs(best.par - 4))) best = { start: a, target: b, par: d };
  }
  return best;
}

// Deterministic PRNG (mulberry32) seeded from a string, so everyone who
// opens the page on the same UTC date gets the exact same daily puzzle.
function seededRng(seedStr) {
  let h = 1779033703 ^ seedStr.length;
  for (let i = 0; i < seedStr.length; i++) {
    h = Math.imul(h ^ seedStr.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return function () {
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  };
}

function todayKey() {
  const d = new Date();
  return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0');
}

let puzzle = null;
let chainWords = [];
let isDailyMode = true;

const startTilesEl = document.getElementById('startTiles');
const targetTilesEl = document.getElementById('targetTiles');
const chainEl = document.getElementById('chain');
const inputs = Array.from(document.querySelectorAll('.letter-input'));
const msgEl = document.getElementById('msg');
const moveCountEl = document.getElementById('moveCount');
const winPanel = document.getElementById('winPanel');
const winTitle = document.getElementById('winTitle');
const winSub = document.getElementById('winSub');
const shareText = document.getElementById('shareText');
const shareLink = document.getElementById('shareLink');
const inputRow = document.getElementById('inputRow');
const modeLabelEl = document.getElementById('modeLabel');

function renderStaticTiles(container, word, goal) {
  container.innerHTML = '';
  word.toUpperCase().split('').forEach(ch => {
    const div = document.createElement('div');
    div.className = 'tile' + (goal ? ' goal' : '');
    div.textContent = ch;
    container.appendChild(div);
  });
}

function renderChain() {
  chainEl.innerHTML = '';
  chainWords.forEach((word, idx) => {
    const row = document.createElement('div');
    row.className = 'chain-row';

    const indexEl = document.createElement('div');
    indexEl.className = 'chain-index';
    indexEl.textContent = idx === 0 ? '' : idx;
    row.appendChild(indexEl);

    const tiles = document.createElement('div');
    tiles.className = 'tiles';
    word.toUpperCase().split('').forEach((ch, i) => {
      const div = document.createElement('div');
      const correct = puzzle.target[i] === word[i];
      div.className = 'tile' + (correct ? ' correct' : '');
      div.textContent = ch;
      tiles.appendChild(div);
    });
    row.appendChild(tiles);
    chainEl.appendChild(row);
  });
  chainEl.scrollTop = chainEl.scrollHeight;
}

function setMsg(text, type) {
  msgEl.textContent = text || '';
  msgEl.className = 'msg' + (type ? ' ' + type : '');
}

function newPuzzle(daily) {
  isDailyMode = !!daily;
  puzzle = isDailyMode ? pickPuzzle(seededRng('word-ladder-' + todayKey())) : pickPuzzle();
  modeLabelEl.innerHTML = isDailyMode
    ? "<strong>Today's Challenge</strong> — same puzzle for everyone. Share your score!"
    : '<strong>Practice Round</strong> — a random puzzle just for you.';
  chainWords = [puzzle.start];
  renderStaticTiles(startTilesEl, puzzle.start, false);
  renderStaticTiles(targetTilesEl, puzzle.target, true);
  renderChain();
  moveCountEl.textContent = '0';
  setMsg('', '');
  winPanel.classList.add('hidden');
  inputRow.parentElement.classList.remove('hidden');
  document.getElementById('submitBtn').disabled = false;
  document.getElementById('newPuzzleBtn').disabled = false;
  inputs.forEach(i => i.value = '');
  inputs[0].focus();
}

function currentGuess() {
  return inputs.map(i => i.value.trim().toLowerCase()).join('');
}

function submitGuess() {
  const guess = currentGuess();
  if (guess.length !== 4 || !/^[a-z]{4}$/.test(guess)) {
    setMsg('Enter 4 letters.', 'error');
    return;
  }
  const prev = chainWords[chainWords.length - 1];
  const d = diffCount(prev, guess);
  if (d === 0) {
    setMsg('That’s the same word — change one letter.', 'error');
    return;
  }
  if (d > 1) {
    setMsg('Change exactly one letter from "' + prev.toUpperCase() + '".', 'error');
    return;
  }
  if (!WORD_SET.has(guess)) {
    setMsg('"' + guess.toUpperCase() + '" isn’t in the word list. Try another real word.', 'error');
    return;
  }
  if (chainWords.includes(guess)) {
    setMsg('You already used that word.', 'error');
    return;
  }

  chainWords.push(guess);
  renderChain();
  moveCountEl.textContent = String(chainWords.length - 1);
  inputs.forEach(i => i.value = '');
  inputs[0].focus();

  if (guess === puzzle.target) {
    setMsg('', '');
    win();
  } else {
    setMsg('', '');
  }
}

function win() {
  const moves = chainWords.length - 1;
  const par = puzzle.par;
  let title, sub;
  if (moves <= par) {
    title = 'Perfect! 🏆';
    sub = 'You solved it in the minimum possible moves.';
  } else if (moves <= par + 2) {
    title = 'Nice work! 🎉';
    sub = 'Solved in ' + moves + ' moves (best possible was ' + par + ').';
  } else {
    title = 'Solved! ✅';
    sub = 'It took ' + moves + ' moves (best possible was ' + par + ').';
  }
  winTitle.textContent = title;
  winSub.textContent = sub;
  const shareLines = isDailyMode ? [
    "🧩 Today's Word Ladder Challenge",
    puzzle.start.toUpperCase() + ' → ' + puzzle.target.toUpperCase() + ' in ' + moves + ' moves (best possible: ' + par + ')',
    '',
    'Everyone gets the same puzzle today — think you can beat my score? 👇',
    window.location.href
  ] : [
    '🧩 Word Ladder (practice round)',
    puzzle.start.toUpperCase() + ' → ' + puzzle.target.toUpperCase() + ' in ' + moves + ' moves (best possible: ' + par + ')',
    '',
    'Try today\'s real challenge here 👇',
    window.location.href
  ];
  shareText.value = shareLines.join('\n');
  shareText.style.height = 'auto';
  shareText.style.height = shareText.scrollHeight + 'px';
  shareLink.href = window.location.href;
  winPanel.classList.remove('hidden');
  inputRow.parentElement.classList.add('hidden');
}

inputs.forEach((input, idx) => {
  input.addEventListener('input', () => {
    input.value = input.value.replace(/[^a-zA-Z]/g, '').slice(-1);
    if (input.value && idx < inputs.length - 1) inputs[idx + 1].focus();
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace' && !input.value && idx > 0) {
      inputs[idx - 1].focus();
    }
    if (e.key === 'Enter') {
      submitGuess();
    }
  });
  input.addEventListener('paste', (e) => {
    const text = (e.clipboardData || window.clipboardData).getData('text').trim().toLowerCase();
    if (/^[a-z]{4}$/.test(text)) {
      e.preventDefault();
      text.split('').forEach((ch, i) => { inputs[i].value = ch; });
      inputs[3].focus();
    }
  });
});

document.getElementById('submitBtn').addEventListener('click', submitGuess);
document.getElementById('newPuzzleBtn').addEventListener('click', () => newPuzzle(false));
document.getElementById('playAgainBtn').addEventListener('click', () => newPuzzle(false));
document.getElementById('copyBtn').addEventListener('click', () => {
  shareText.select();
  navigator.clipboard.writeText(shareText.value).then(() => {
    document.getElementById('copyBtn').textContent = 'Copied!';
    setTimeout(() => { document.getElementById('copyBtn').textContent = 'Copy result to share'; }, 1500);
  }).catch(() => {});
});

newPuzzle(true);
</script>
