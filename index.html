<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Ladder</title>
<style>
  :root{
    --bg:#15181c;
    --card:#1f2328;
    --text:#e6e8eb;
    --muted:#9aa2ab;
    --border:#33383f;
    --tile-bg:#262b31;
    --tile-border:#3a4048;
    --tile-goal-bg:#1f2328;
    --tile-goal-border:#3b9eff;
    --accent:#3b9eff;
    --accent-text:#0b1015;
    --danger:#ff6b6b;
    --success:#4fd17a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;
    justify-content:center;
    padding:24px 16px 60px;
  }
  .wrap{
    width:100%;
    max-width:480px;
  }
  h1{
    font-size:1.5rem;
    margin:0 0 4px;
    text-align:center;
  }
  .sub{
    color:var(--muted);
    text-align:center;
    font-size:0.9rem;
    margin:0 0 20px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px;
    margin-bottom:16px;
  }
  .goal-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    flex-wrap:wrap;
  }
  .goal-label{
    font-size:0.7rem;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--muted);
    text-align:center;
    margin-bottom:6px;
  }
  .arrow{
    font-size:1.4rem;
    color:var(--muted);
  }
  .tiles{
    display:flex;
    gap:6px;
  }
  .tile{
    width:44px;
    height:44px;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    font-size:1.2rem;
    background:var(--tile-bg);
    border:1px solid var(--tile-border);
  }
  .tile.goal{
    background:var(--tile-goal-bg);
    border:2px solid var(--tile-goal-border);
    color:var(--accent);
  }
  .tile.correct{
    background:var(--success);
    color:#0b1015;
    border-color:var(--success);
  }
  .chain{
    display:flex;
    flex-direction:column;
    gap:6px;
    max-height:260px;
    overflow-y:auto;
    padding-right:2px;
  }
  .chain-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .chain-index{
    width:20px;
    color:var(--muted);
    font-size:0.8rem;
    text-align:right;
    flex-shrink:0;
  }
  .input-row{
    display:flex;
    gap:8px;
    justify-content:center;
    margin-top:4px;
  }
  .letter-input{
    width:44px;
    height:44px;
    text-align:center;
    font-size:1.2rem;
    font-weight:700;
    text-transform:uppercase;
    border-radius:8px;
    border:1px solid var(--tile-border);
    background:var(--tile-bg);
    color:var(--text);
  }
  .letter-input:focus{
    outline:2px solid var(--accent);
  }
  .btn-row{
    display:flex;
    gap:8px;
    margin-top:14px;
    justify-content:center;
    flex-wrap:wrap;
  }
  button{
    font-family:inherit;
    font-size:0.9rem;
    font-weight:600;
    padding:10px 16px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    cursor:pointer;
  }
  button.primary{
    background:var(--accent);
    color:var(--accent-text);
    border-color:var(--accent);
  }
  button:active{ transform:scale(0.98); }
  button:disabled{ opacity:0.45; cursor:not-allowed; }
  .msg{
    min-height:20px;
    text-align:center;
    font-size:0.85rem;
    margin-top:10px;
  }
  .msg.error{ color:var(--danger); }
  .msg.ok{ color:var(--success); }
  .stats{
    display:flex;
    justify-content:center;
    gap:24px;
    text-align:center;
    color:var(--muted);
    font-size:0.85rem;
  }
  .stats b{
    display:block;
    color:var(--text);
    font-size:1.1rem;
  }
  .win-panel{
    text-align:center;
  }
  .win-panel h2{
    margin:0 0 6px;
    font-size:1.3rem;
  }
  .win-panel p{
    color:var(--muted);
    margin:0 0 14px;
    font-size:0.9rem;
  }
  .share-wrap{
    position:relative;
  }
  .copy-icon-btn{
    position:absolute;
    top:8px;
    right:8px;
    width:28px;
    height:28px;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:0.9rem;
    line-height:1;
    border-radius:6px;
    border:1px solid var(--tile-border);
    background:var(--card);
    color:var(--text);
    cursor:pointer;
  }
  textarea.share{
    width:100%;
    min-height:70px;
    resize:none;
    overflow:hidden;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--tile-bg);
    color:var(--text);
    font-family:inherit;
    font-size:0.85rem;
    line-height:1.5;
    padding:10px 40px 10px 10px;
    margin-bottom:10px;
  }
  .hidden{ display:none; }
  footer{
    text-align:center;
    color:var(--muted);
    font-size:0.75rem;
    margin-top:8px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🪜 Word Ladder</h1>
  <p class="sub">Turn the start word into the target word — one letter at a time. Every step must be a real word.</p>
  <p class="sub" id="modeLabel" style="margin-top:-14px;"></p>

  <div class="card">
    <div class="goal-row">
      <div>
        <div class="goal-label">Start</div>
        <div class="tiles" id="startTiles"></div>
      </div>
      <div class="arrow">→</div>
      <div>
        <div class="goal-label">Target</div>
        <div class="tiles" id="targetTiles"></div>
      </div>
    </div>
    <div class="btn-row" style="margin-top:14px;">
      <button id="dailyBtn">Today's Challenge</button>
      <button id="newPuzzleBtn">New Puzzle</button>
    </div>
  </div>

  <div class="card">
    <div class="chain" id="chain"></div>
    <div class="input-row" id="inputRow">
      <input class="letter-input" maxlength="1" autocapitalize="characters" autocomplete="off" spellcheck="false">
      <input class="letter-input" maxlength="1" autocapitalize="characters" autocomplete="off" spellcheck="false">
      <input class="letter-input" maxlength="1" autocapitalize="characters" autocomplete="off" spellcheck="false">
      <input class="letter-input" maxlength="1" autocapitalize="characters" autocomplete="off" spellcheck="false">
    </div>
    <div class="msg" id="msg"></div>
    <div class="stats">
      <div>Moves<b id="moveCount">0</b></div>
    </div>
    <div class="btn-row">
      <button id="submitBtn" class="primary">Enter</button>
      <button id="resetBtn" class="hidden">Reset</button>
    </div>
  </div>

  <div class="card win-panel hidden" id="winPanel">
    <h2 id="winTitle">Solved!</h2>
    <p id="winSub"></p>
    <div class="share-wrap">
      <textarea class="share" id="shareText" readonly></textarea>
      <button class="copy-icon-btn" id="copyIconBtn" title="Copy to clipboard" aria-label="Copy to clipboard">📋</button>
    </div>
    <div class="btn-row">
      <button class="primary" id="copyBtn">Copy result to share</button>
      <button id="playAgainBtn" class="hidden">Play again</button>
    </div>
  </div>

  <footer>Word list: common 4-letter English words. New daily challenge every day.</footer>
</div>

<script>
const API_BASE = "https://word-ladder-api.word-ladder-api.workers.dev";

async function fetchPuzzle(daily) {
  const res = await fetch(API_BASE + "/puzzle?mode=" + (daily ? "daily" : "practice"));
  if (!res.ok) throw new Error("puzzle fetch failed");
  return res.json();
}

async function checkGuess(previous, guess) {
  const res = await fetch(API_BASE + "/guess", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ previous, guess }),
  });
  if (!res.ok) throw new Error("guess check failed");
  return res.json();
}

function diffCount(a, b) {
  let c = 0;
  for (let i = 0; i < 4; i++) if (a[i] !== b[i]) c++;
  return c;
}

let puzzle = null;
let chainWords = [];
let isDailyMode = true;

const startTilesEl = document.getElementById('startTiles');
const targetTilesEl = document.getElementById('targetTiles');
const chainEl = document.getElementById('chain');
const inputs = Array.from(document.querySelectorAll('.letter-input'));
const msgEl = document.getElementById('msg');
const moveCountEl = document.getElementById('moveCount');
const winPanel = document.getElementById('winPanel');
const winTitle = document.getElementById('winTitle');
const winSub = document.getElementById('winSub');
const shareText = document.getElementById('shareText');
const inputRow = document.getElementById('inputRow');
const modeLabelEl = document.getElementById('modeLabel');

function renderStaticTiles(container, word, goal) {
  container.innerHTML = '';
  word.toUpperCase().split('').forEach(ch => {
    const div = document.createElement('div');
    div.className = 'tile' + (goal ? ' goal' : '');
    div.textContent = ch;
    container.appendChild(div);
  });
}

function renderChain() {
  chainEl.innerHTML = '';
  chainWords.forEach((word, idx) => {
    const row = document.createElement('div');
    row.className = 'chain-row';

    const indexEl = document.createElement('div');
    indexEl.className = 'chain-index';
    indexEl.textContent = idx === 0 ? '' : idx;
    row.appendChild(indexEl);

    const tiles = document.createElement('div');
    tiles.className = 'tiles';
    word.toUpperCase().split('').forEach((ch, i) => {
      const div = document.createElement('div');
      const correct = puzzle.target[i] === word[i];
      div.className = 'tile' + (correct ? ' correct' : '');
      div.textContent = ch;
      tiles.appendChild(div);
    });
    row.appendChild(tiles);
    chainEl.appendChild(row);
  });
  chainEl.scrollTop = chainEl.scrollHeight;
}

function setMsg(text, type) {
  msgEl.textContent = text || '';
  msgEl.className = 'msg' + (type ? ' ' + type : '');
}

function resetChain() {
  chainWords = [puzzle.start];
  renderStaticTiles(startTilesEl, puzzle.start, false);
  renderStaticTiles(targetTilesEl, puzzle.target, true);
  renderChain();
  moveCountEl.textContent = '0';
  setMsg('', '');
  inputs.forEach(i => i.value = '');
  inputs[0].focus();
}

function replaySamePuzzle() {
  resetChain();
  winPanel.classList.add('hidden');
  inputRow.parentElement.classList.remove('hidden');
}

async function newPuzzle(daily) {
  isDailyMode = !!daily;
  document.getElementById('submitBtn').disabled = true;
  document.getElementById('dailyBtn').disabled = true;
  document.getElementById('newPuzzleBtn').disabled = true;
  winPanel.classList.add('hidden');
  inputRow.parentElement.classList.remove('hidden');
  setMsg('Loading puzzle…', '');
  chainEl.innerHTML = '';
  startTilesEl.innerHTML = '';
  targetTilesEl.innerHTML = '';

  let fetched;
  try {
    fetched = await fetchPuzzle(isDailyMode);
  } catch (e) {
    setMsg('Could not load puzzle — check your connection and try again.', 'error');
    document.getElementById('dailyBtn').disabled = isDailyMode;
    document.getElementById('newPuzzleBtn').disabled = false;
    return;
  }

  puzzle = fetched;
  modeLabelEl.innerHTML = isDailyMode
    ? "<strong>Today's Challenge</strong> — same puzzle for everyone. Share your score!"
    : '<strong>Practice Round</strong> — a random puzzle just for you.';
  resetChain();
  document.getElementById('submitBtn').disabled = false;
  document.getElementById('dailyBtn').disabled = isDailyMode;
  document.getElementById('newPuzzleBtn').disabled = false;
  document.getElementById('resetBtn').classList.toggle('hidden', isDailyMode);
}

function currentGuess() {
  return inputs.map(i => i.value.trim().toLowerCase()).join('');
}

async function submitGuess() {
  const guess = currentGuess();
  if (guess.length !== 4 || !/^[a-z]{4}$/.test(guess)) {
    setMsg('Enter 4 letters.', 'error');
    return;
  }
  const prev = chainWords[chainWords.length - 1];
  const d = diffCount(prev, guess);
  if (d === 0) {
    setMsg('That’s the same word — change one letter.', 'error');
    return;
  }
  if (d > 1) {
    setMsg('Change exactly one letter from "' + prev.toUpperCase() + '".', 'error');
    return;
  }
  if (chainWords.includes(guess)) {
    setMsg('You already used that word.', 'error');
    return;
  }

  document.getElementById('submitBtn').disabled = true;
  let result;
  try {
    result = await checkGuess(prev, guess);
  } catch (e) {
    setMsg('Could not check that word — check your connection and try again.', 'error');
    document.getElementById('submitBtn').disabled = false;
    return;
  }
  document.getElementById('submitBtn').disabled = false;

  if (!result.valid) {
    setMsg(result.reason || 'Not a valid move.', 'error');
    return;
  }

  chainWords.push(guess);
  renderChain();
  moveCountEl.textContent = String(chainWords.length - 1);
  inputs.forEach(i => i.value = '');
  inputs[0].focus();

  if (guess === puzzle.target) {
    setMsg('', '');
    win();
  } else {
    setMsg('', '');
  }
}

function win() {
  const moves = chainWords.length - 1;
  const par = puzzle.par;
  let title, sub;
  if (moves <= par) {
    title = 'Perfect! 🏆';
    sub = 'You solved it in the minimum possible moves.';
  } else if (moves <= par + 2) {
    title = 'Nice work! 🎉';
    sub = 'Solved in ' + moves + ' moves (best possible was ' + par + ').';
  } else {
    title = 'Solved! ✅';
    sub = 'It took ' + moves + ' moves (best possible was ' + par + ').';
  }
  winTitle.textContent = title;
  winSub.textContent = sub;
  const shareLines = isDailyMode ? [
    "🧩 Today's Word Ladder Challenge",
    puzzle.start.toUpperCase() + ' → ' + puzzle.target.toUpperCase() + ' in ' + moves + ' moves (best possible: ' + par + ')',
    '',
    'Everyone gets the same puzzle today — think you can beat my score? 👇',
    window.location.href
  ] : [
    '🧩 Word Ladder (practice round)',
    puzzle.start.toUpperCase() + ' → ' + puzzle.target.toUpperCase() + ' in ' + moves + ' moves (best possible: ' + par + ')',
    '',
    'Try today\'s real challenge here 👇',
    window.location.href
  ];
  shareText.value = shareLines.join('\n');
  shareText.style.height = 'auto';
  shareText.style.height = shareText.scrollHeight + 'px';
  document.getElementById('playAgainBtn').classList.toggle('hidden', isDailyMode);
  winPanel.classList.remove('hidden');
  inputRow.parentElement.classList.add('hidden');
}

inputs.forEach((input, idx) => {
  input.addEventListener('input', () => {
    input.value = input.value.replace(/[^a-zA-Z]/g, '').slice(-1);
    if (input.value && idx < inputs.length - 1) inputs[idx + 1].focus();
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace' && !input.value && idx > 0) {
      inputs[idx - 1].focus();
    }
    if (e.key === 'Enter') {
      submitGuess();
    }
  });
  input.addEventListener('paste', (e) => {
    const text = (e.clipboardData || window.clipboardData).getData('text').trim().toLowerCase();
    if (/^[a-z]{4}$/.test(text)) {
      e.preventDefault();
      text.split('').forEach((ch, i) => { inputs[i].value = ch; });
      inputs[3].focus();
    }
  });
});

document.getElementById('submitBtn').addEventListener('click', submitGuess);
document.getElementById('resetBtn').addEventListener('click', resetChain);
document.getElementById('dailyBtn').addEventListener('click', () => newPuzzle(true));
document.getElementById('newPuzzleBtn').addEventListener('click', () => newPuzzle(false));
document.getElementById('playAgainBtn').addEventListener('click', replaySamePuzzle);
function copyShareText() {
  shareText.select();
  return navigator.clipboard.writeText(shareText.value);
}

const copyBtn = document.getElementById('copyBtn');
const copyIconBtn = document.getElementById('copyIconBtn');

copyBtn.addEventListener('click', () => {
  copyShareText().then(() => {
    copyBtn.textContent = 'Copied!';
    setTimeout(() => { copyBtn.textContent = 'Copy result to share'; }, 1500);
  }).catch(() => {});
});

copyIconBtn.addEventListener('click', () => {
  copyShareText().then(() => {
    copyIconBtn.textContent = '✅';
    setTimeout(() => { copyIconBtn.textContent = '📋'; }, 1500);
  }).catch(() => {});
});

newPuzzle(false);
</script>
</body>
</html>
